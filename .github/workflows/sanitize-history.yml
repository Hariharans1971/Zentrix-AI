name: Sanitize historical secrets and virtualenv

on:
  workflow_dispatch:
    inputs:
      confirm_rotation:
        description: "Select yes ONLY after revoking the previously exposed Groq API key and creating a replacement outside Git."
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: sanitize-history-zentrix
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Require rotation confirmation and main branch
        env:
          CONFIRM_ROTATION: ${{ inputs.confirm_rotation }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [ "$CONFIRM_ROTATION" != "yes" ]; then
            echo "::error::No history changes were made. Revoke the exposed Groq key first, then re-run and explicitly select yes."
            exit 1
          fi
          if [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi

  rewrite:
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm current tree is already clean
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-tree -r --name-only HEAD | grep -E '^(\.streamlit/secrets\.toml|venv/)'; then
            echo "::error::Sensitive paths exist in the current tree. Stop and review before history rewrite."
            exit 1
          fi
          echo "Current tree is clean; this job will remove only old .streamlit/secrets.toml and venv/ history."

      - name: Remove old secrets and virtual environment from every commit
        shell: bash
        run: |
          set -Eeuo pipefail
          original_head="$GITHUB_SHA"
          python -m pip install --disable-pip-version-check git-filter-repo
          git filter-repo --force --path .streamlit/secrets.toml --path venv/ --invert-paths

          if git log --all --format= --name-only | grep -E '^(\.streamlit/secrets\.toml|venv/)'; then
            echo "::error::Sanitized history still contains a target path; refusing to push."
            exit 1
          fi

          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push --force-with-lease="refs/heads/main:$original_head" origin HEAD:refs/heads/main

          echo "History rewritten and pushed with force-with-lease. Commit IDs changed; current application files were preserved."
        env:
          GH_TOKEN: ${{ github.token }}
